<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneo Oficial - Blood Strike Arena</title>
    <style>
        :root {
            --bg-base: #07090e;
            --bg-card: rgba(18, 22, 33, 0.85);
            --border-color: #232a40;
            --accent-pink: #ff0055;
            --accent-cyan: #00f2ff;
            --accent-green: #00ff66;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body { 
            background: radial-gradient(circle at top, #141b2d 0%, var(--bg-base) 100%); 
            color: var(--text-main); 
            min-height: 100vh;
            padding-bottom: 60px;
        }

        /* Cabecera Épica */
        header { 
            background: linear-gradient(180deg, #151b2c 0%, rgba(7,9,14,0.9) 100%); 
            padding: 30px 20px; 
            border-bottom: 3px solid var(--accent-pink); 
            box-shadow: 0 10px 40px rgba(255, 0, 85, 0.25);
            text-align: center;
        }
        h1 { 
            font-size: 2.5rem; 
            background: linear-gradient(90deg, var(--accent-pink), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase; 
            letter-spacing: 3px; 
            font-weight: 900;
        }
        .sub-header { color: var(--text-muted); font-size: 1rem; margin-top: 8px; text-transform: uppercase; letter-spacing: 2px; font-weight: 600; }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }

        /* Contenedores Principales Estilo Glassmorphism */
        .section-box { 
            background: var(--bg-card); 
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color); 
            border-radius: 16px; 
            padding: 30px; 
            margin-bottom: 40px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); 
        }
        h2 { 
            color: var(--accent-cyan); 
            margin-bottom: 25px; 
            text-transform: uppercase; 
            font-size: 1.5rem; 
            letter-spacing: 1.5px; 
            text-align: center;
            font-weight: 800;
        }

        /* Botón Desplegable del Live */
        .btn-desplegable {
            background: linear-gradient(135deg, var(--accent-pink), #cc0043);
            color: white;
            border: none;
            padding: 16px 24px;
            width: 100%;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 6px 20px rgba(255,0,85,0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            letter-spacing: 1px;
        }
        .btn-desplegable:hover { filter: brightness(1.1); transform: translateY(-2px); }
        
        .live-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .live-content.activo {
            max-height: 700px;
            margin-top: 25px;
        }
        .live-player { 
            position: relative; 
            padding-bottom: 56.25%; 
            height: 0; 
            overflow: hidden; 
            border-radius: 12px; 
            border: 2px solid var(--accent-pink); 
            background: #000; 
            box-shadow: 0 0 30px rgba(255,0,85,0.3);
        }
        .live-player iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        /* Cuadrícula de Clips (Tarjetas Gamers) */
        .grid-clips { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 25px; }
        .clip-card { 
            background: #121622; 
            border-radius: 14px; 
            padding: 18px; 
            border: 1px solid var(--border-color); 
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
        }
        .clip-card:hover { border-color: var(--accent-cyan); transform: translateY(-5px); box-shadow: 0 12px 35px rgba(0,242,255,0.2); }
        
        .tiktok-embed { background: #000; height: 380px; border-radius: 10px; width: 100%; border: none; }
        
        /* Botón de Votación */
        .btn-votar { 
            background: linear-gradient(135deg, var(--accent-cyan), #0088ff); 
            color: #000; 
            border: none; 
            padding: 14px; 
            width: 100%; 
            font-weight: 900; 
            border-radius: 10px; 
            cursor: pointer; 
            margin-top: 18px; 
            text-transform: uppercase; 
            font-size: 1rem;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(0,242,255,0.3);
            transition: all 0.2s; 
        }
        .btn-votar:hover { filter: brightness(1.15); transform: scale(1.02); }
        .btn-votar:disabled { background: #1f2638; color: var(--text-muted); cursor: not-allowed; box-shadow: none; transform: none; }
        
        .status-cerrado { 
            background: rgba(255,0,85,0.15);
            border: 1px solid var(--accent-pink);
            color: var(--accent-pink); 
            font-weight: 800; 
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px; 
            font-size: 1.1rem; 
            display: none; 
            text-shadow: 0 0 10px rgba(255,0,85,0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Barras de Progreso Avanzadas */
        .bar-container { background: #07090e; height: 14px; border-radius: 7px; margin-top: 15px; overflow: hidden; border: 1px solid var(--border-color); }
        .bar-fill { background: linear-gradient(90deg, var(--accent-pink), var(--accent-cyan)); height: 100%; width: 0%; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 10px rgba(0,242,255,0.4); }
        .stats { display: flex; justify-content: space-between; font-size: 0.9rem; margin-top: 8px; color: var(--text-muted); font-weight: 700; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Blood Strike Arena ⚡</h1>
        <div class="sub-header">Torneo Oficial & Votación de Mejores Clips</div>
    </header>

    <div class="container">
        <!-- SECCIÓN EN VIVO DESPLEGABLE -->
        <div class="section-box" id="seccion-live" style="display:none;">
            <button class="btn-desplegable" onclick="toggleLive()">
                🔴 <span id="texto-btn-live">Ver Transmisión en Vivo</span> ▼
            </button>
            <div class="live-content" id="live-content-box">
                <div class="live-player" style="margin-top: 20px;">
                    <iframe id="iframe-live" src="" allowfullscreen></iframe>
                </div>
            </div>
        </div>

        <!-- SECCIÓN VOTACIONES -->
        <div class="section-box">
            <h2>🔥 Vota por el Mejor Jugador de la Jornada 🔥</h2>
            <div id="msg-cerrado" class="status-cerrado">🔒 Las votaciones se encuentran cerradas temporalmente</div>
            
            <div class="grid-clips">
                <!-- Clip 1 -->
                <div class="clip-card">
                    <iframe id="iframe-clip1" class="tiktok-embed" src=""></iframe>
                    <div>
                        <button class="btn-votar btn-accion" id="btn-1" onclick="votar('clip1')">Votar Clip 1</button>
                        <div class="bar-container"><div class="bar-fill" id="barra-clip1"></div></div>
                        <div class="stats"><span id="votos-clip1">0 votos</span><span id="porcentaje-clip1">0%</span></div>
                    </div>
                </div>
                <!-- Clip 2 -->
                <div class="clip-card">
                    <iframe id="iframe-clip2" class="tiktok-embed" src=""></iframe>
                    <div>
                        <button class="btn-votar btn-accion" id="btn-2" onclick="votar('clip2')">Votar Clip 2</button>
                        <div class="bar-container"><div class="bar-fill" id="barra-clip2"></div></div>
                        <div class="stats"><span id="votos-clip2">0 votos</span><span id="porcentaje-clip2">0%</span></div>
                    </div>
                </div>
                <!-- Clip 3 -->
                <div class="clip-card">
                    <iframe id="iframe-clip3" class="tiktok-embed" src=""></iframe>
                    <div>
                        <button class="btn-votar btn-accion" id="btn-3" onclick="votar('clip3')">Votar Clip 3</button>
                        <div class="bar-container"><div class="bar-fill" id="barra-clip3"></div></div>
                        <div class="stats"><span id="votos-clip3">0 votos</span><span id="porcentaje-clip3">0%</span></div>
                    </div>
                </div>
                <!-- Clip 4 -->
                <div class="clip-card">
                    <iframe id="iframe-clip4" class="tiktok-embed" src=""></iframe>
                    <div>
                        <button class="btn-votar btn-accion" id="btn-4" onclick="votar('clip4')">Votar Clip 4</button>
                        <div class="bar-container"><div class="bar-fill" id="barra-clip4"></div></div>
                        <div class="stats"><span id="votos-clip4">0 votos</span><span id="porcentaje-clip4">0%</span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getDatabase, ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

        // PEGA AQUÍ TU CONFIGURACIÓN DE FIREBASE
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_PROJECT.firebaseapp.com",
            databaseURL: "https://TU_PROJECT-default-rtdb.firebaseio.com",
            projectId: "TU_PROJECT",
            storageBucket: "TU_PROJECT.appspot.com",
            messagingSenderId: "TU_SENDER_ID",
            appId: "TU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Control del botón desplegable del Live
        window.toggleLive = function() {
            const box = document.getElementById('live-content-box');
            box.classList.toggle('activo');
            const btnText = document.getElementById('texto-btn-live');
            if(box.classList.contains('activo')) {
                btnText.innerText = "Ocultar Transmisión en Vivo";
            } else {
                btnText.innerText = "Ver Transmisión en Vivo";
            }
        };

        // Escuchar configuración dinámica desde el panel admin
        onValue(ref(db, 'config'), (snapshot) => {
            const config = snapshot.val() || {};
            
            if(config.live && config.live.trim() !== "") {
                document.getElementById('seccion-live').style.display = 'block';
                document.getElementById('iframe-live').src = config.live;
            } else {
                document.getElementById('seccion-live').style.display = 'none';
                document.getElementById('iframe-live').src = "";
            }

            for(let i=1; i<=4; i++) {
                if(config[`clip${i}`]) {
                    document.getElementById(`iframe-clip${i}`).src = config[`clip${i}`];
                }
            }

            const botones = document.querySelectorAll('.btn-accion');
            if(config.votacion_activa === false) {
                botones.forEach(btn => btn.style.display = 'none');
                document.getElementById('msg-cerrado').style.display = 'block';
            } else {
                botones.forEach(btn => btn.style.display = 'block');
                document.getElementById('msg-cerrado').style.display = 'none';
                verificarSiVoto();
            }
        });

        // Escuchar Votos en tiempo real
        onValue(ref(db, 'votos'), (snapshot) => {
            const data = snapshot.val() || { clip1: 0, clip2: 0, clip3: 0, clip4: 0 };
            const total = (data.clip1||0) + (data.clip2||0) + (data.clip3||0) + (data.clip4||0);

            ['clip1', 'clip2', 'clip3', 'clip4'].forEach(clip => {
                const votos = data[clip] || 0;
                const porcentaje = total > 0 ? Math.round((votos / total) * 100) : 0;
                document.getElementById(`votos-${clip}`).innerText = `${votos} votos`;
                document.getElementById(`porcentaje-${clip}`).innerText = `${porcentaje}%`;
                document.getElementById(`barra-${clip}`).style.width = `${porcentaje}%`;
            });
        });

        window.votar = function(clipId) {
            if (localStorage.getItem('yaVoto_torneo')) { 
                alert("⚠️ Ya has registrado tu voto en este torneo."); 
                return; 
            }
            runTransaction(ref(db, `votos/${clipId}`), (actuales) => (actuales || 0) + 1).then(() => {
                localStorage.setItem('yaVoto_torneo', 'true');
                alert("✅ ¡Tu voto ha sido registrado con éxito!");
                verificarSiVoto();
            });
        };

        function verificarSiVoto() {
            if (localStorage.getItem('yaVoto_torneo')) {
                document.querySelectorAll('.btn-accion').forEach(btn => {
                    btn.disabled = true; 
                    btn.innerText = "Voto Registrado 🔒";
                });
            }
        }
    </script>
</body>
</html>
