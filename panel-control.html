<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Blood Strike LATAM</title>
    <style>
        :root {
            --bg-base: #07090e;
            --bg-card: rgba(18, 22, 33, 0.95);
            --border-color: #232a40;
            --accent-pink: #ff0055;
            --accent-cyan: #00f2ff;
            --accent-green: #00ff66;
            --accent-yellow: #ffcc00;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body { 
            background: radial-gradient(circle at top, #141b2d 0%, var(--bg-base) 100%); 
            color: var(--text-main); 
            min-height: 100vh; 
            padding: 40px 20px; 
        }

        .container { max-width: 950px; margin: 0 auto; }

        header { 
            background: var(--bg-card); 
            border: 1px solid var(--border-color); 
            padding: 25px; 
            border-radius: 16px; 
            margin-bottom: 25px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { 
            font-size: 1.6rem; 
            color: var(--accent-cyan);
            text-transform: uppercase; 
            letter-spacing: 1px;
        }
        
        .btn-regresar {
            background: #151b2c; border: 1px solid var(--border-color);
            color: var(--text-main); padding: 10px 18px; border-radius: 8px;
            font-weight: bold; text-decoration: none; font-size: 0.85rem;
            transition: all 0.2s;
        }
        .btn-regresar:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }

        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        @media(max-width: 768px) { .admin-grid { grid-template-columns: 1fr; } }

        .card {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 16px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 25px;
        }
        .card h2 { font-size: 1.2rem; color: var(--accent-yellow); margin-bottom: 15px; text-transform: uppercase; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }

        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.85rem; color: var(--text-muted); font-weight: bold; text-transform: uppercase; }
        input, textarea {
            background: #07090e; border: 1px solid var(--border-color);
            padding: 12px; border-radius: 8px; color: var(--text-main); font-size: 0.9rem;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--accent-cyan); }
        textarea { resize: vertical; height: 100px; }

        .btn-action {
            background: linear-gradient(135deg, var(--accent-cyan), #0088ff);
            color: #000; border: none; padding: 12px 20px; font-weight: 900;
            border-radius: 8px; cursor: pointer; text-transform: uppercase; font-size: 0.9rem;
            width: 100%; transition: filter 0.2s; box-shadow: 0 4px 15px rgba(0,242,255,0.3);
            margin-top: 5px;
        }
        .btn-action:hover { filter: brightness(1.1); }

        .btn-success {
            background: linear-gradient(135deg, var(--accent-green), #00aa44);
            color: #000; box-shadow: 0 4px 15px rgba(0,255,102,0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--accent-pink), #aa0033);
            color: #fff; box-shadow: 0 4px 15px rgba(255,0,85,0.3);
        }

        .status-box {
            background: rgba(0, 255, 102, 0.05); border: 1px solid var(--accent-green);
            padding: 15px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 25px;
        }
        .status-box.closed {
            background: rgba(255, 0, 85, 0.05); border-color: var(--accent-pink);
        }
        .status-text { font-weight: bold; font-size: 1rem; }
        
        .btn-toggle-vote {
            background: #151b2c; border: 1px solid var(--border-color); color: var(--text-main);
            padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.8rem;
        }
        .btn-toggle-vote:hover { border-color: var(--accent-cyan); }

        /* Estadísticas en Vivo Admin */
        .stats-preview-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-bottom: 20px;
        }
        .stat-box-admin {
            background: #07090e; border: 1px solid var(--border-color); border-radius: 10px;
            padding: 15px; text-align: center;
        }
        .stat-box-admin span { display: block; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; font-weight: bold; margin-bottom: 5px; }
        .stat-box-admin strong { color: var(--accent-cyan); font-size: 1.3rem; }

        .admin-buttons-row {
            display: flex; gap: 15px;
        }
        @media(max-width: 600px) { .admin-buttons-row { flex-direction: column; } }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⚙️ Panel de Control</h1>
            <a href="index.html" class="btn-regresar">Ver Página Principal →</a>
        </header>

        <!-- Control de Estado de Votación -->
        <div class="status-box" id="statusBox">
            <span class="status-text" id="statusText">Estado: Verificando...</span>
            <button class="btn-toggle-vote" onclick="toggleVotacionEstado()">Cambiar Estado</button>
        </div>

        <div class="admin-grid">
            <!-- Configuración de Clips y Enlaces -->
            <div class="card">
                <h2>🎬 Enlaces de Clips y Discord</h2>
                <div class="form-group">
                    <label>Enlace Iframe Clip 1</label>
                    <input type="text" id="input-clip1" placeholder="Ej: https://www.youtube.com/embed/...">
                </div>
                <div class="form-group">
                    <label>Enlace Iframe Clip 2</label>
                    <input type="text" id="input-clip2" placeholder="Ej: https://www.youtube.com/embed/...">
                </div>
                <div class="form-group">
                    <label>Enlace Iframe Clip 3</label>
                    <input type="text" id="input-clip3" placeholder="Ej: https://www.youtube.com/embed/...">
                </div>
                <div class="form-group">
                    <label>Enlace Iframe Clip 4</label>
                    <input type="text" id="input-clip4" placeholder="Ej: https://www.youtube.com/embed/...">
                </div>
                <div class="form-group">
                    <label>Enlace del Servidor de Discord</label>
                    <input type="text" id="input-discord" placeholder="Ej: https://discord.gg/tu-servidor">
                </div>
                <button class="btn-action" onclick="guardarClipsYDiscord()">Guardar Cambios de Enlaces</button>
            </div>

            <!-- Configuración del Salón de la Fama -->
            <div class="card">
                <h2>🏆 Salón de la Fama (Dinámico)</h2>
                <div class="form-group">
                    <label>Título / Temporada</label>
                    <input type="text" id="input-salon-titulo" placeholder="Ej: Torneo Relámpago - Temporada 1">
                </div>
                <div class="form-group">
                    <label>Descripción / Ganadores</label>
                    <textarea id="input-salon-texto" placeholder="Escribe aquí los campeones o la reseña histórica..."></textarea>
                </div>
                <button class="btn-action" onclick="guardarSalonFama()">Actualizar Salón de la Fama</button>
            </div>
        </div>

        <!-- Panel de Votaciones y Exportación -->
        <div class="card">
            <h2>📊 Resultados en Vivo y Exportación</h2>
            <div class="stats-preview-grid">
                <div class="stat-box-admin">
                    <span>Clip 1 Votos</span>
                    <strong id="admin-votos-clip1">0</strong>
                </div>
                <div class="stat-box-admin">
                    <span>Clip 2 Votos</span>
                    <strong id="admin-votos-clip2">0</strong>
                </div>
                <div class="stat-box-admin">
                    <span>Clip 3 Votos</span>
                    <strong id="admin-votos-clip3">0</strong>
                </div>
                <div class="stat-box-admin">
                    <span>Clip 4 Votos</span>
                    <strong id="admin-votos-clip4">0</strong>
                </div>
                <div class="stat-box-admin">
                    <span>Likes Totales</span>
                    <strong id="admin-likes">0</strong>
                </div>
                <div class="stat-box-admin">
                    <span>Compartidos</span>
                    <strong id="admin-shares">0</strong>
                </div>
            </div>

            <div class="admin-buttons-row">
                <button class="btn-action btn-success" onclick="exportarACSV()">📥 Exportar Votos y Comentarios (CSV / Google Sheets)</button>
                <button class="btn-action btn-danger" onclick="reiniciarVotos()">🔄 Reiniciar Todos los Votos a 0</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_PROJECT.firebaseapp.com",
            databaseURL: "https://TU_PROJECT-default-rtdb.firebaseio.com",
            projectId: "TU_PROJECT",
            storageBucket: "TU_PROJECT.appspot.com",
            messagingSenderId: "TU_SENDER_ID",
            appId: "TU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let estadoActualVotacion = true;
        let datosCompletosGlobales = {};

        // Escuchar configuración y datos en tiempo real para el panel
        onValue(ref(db), (snapshot) => {
            const data = snapshot.val() || {};
            datosCompletosGlobales = data; // Guardamos todo para la exportación

            const config = data.config || {};
            document.getElementById('input-clip1').value = config.clip1 || '';
            document.getElementById('input-clip2').value = config.clip2 || '';
            document.getElementById('input-clip3').value = config.clip3 || '';
            document.getElementById('input-clip4').value = config.clip4 || '';
            document.getElementById('input-discord').value = config.discord_link || '';
            
            document.getElementById('input-salon-titulo').value = config.salon_titulo || '';
            document.getElementById('input-salon-texto').value = config.salon_texto || '';

            estadoActualVotacion = config.votacion_activa !== false;
            actualizarInterfazEstado();

            // Actualizar contadores visuales en el panel
            const votos = data.votos || { clip1: 0, clip2: 0, clip3: 0, clip4: 0 };
            document.getElementById('admin-votos-clip1').innerText = votos.clip1 || 0;
            document.getElementById('admin-votos-clip2').innerText = votos.clip2 || 0;
            document.getElementById('admin-votos-clip3').innerText = votos.clip3 || 0;
            document.getElementById('admin-votos-clip4').innerText = votos.clip4 || 0;

            const stats = data.estadisticas || { likes: 0, compartidos: 0 };
            document.getElementById('admin-likes').innerText = stats.likes || 0;
            document.getElementById('admin-shares').innerText = stats.compartidos || 0;
        });

        function actualizarInterfazEstado() {
            const box = document.getElementById('statusBox');
            const text = document.getElementById('statusText');
            if(estadoActualVotacion) {
                box.classList.remove('closed');
                text.innerHTML = "🟢 Estado actual: Votaciones ABIERTAS al público";
            } else {
                box.classList.add('closed');
                text.innerHTML = "🔴 Estado actual: Votaciones CERRADAS (Pausadas)";
            }
        }

        window.toggleVotacionEstado = function() {
            const nuevoEstado = !estadoActualVotacion;
            update(ref(db, 'config'), { votacion_activa: nuevoEstado }).then(() => {
                alert("¡Estado de votación actualizado!");
            });
        };

        window.guardarClipsYDiscord = function() {
            const updates = {
                clip1: document.getElementById('input-clip1').value.trim(),
                clip2: document.getElementById('input-clip2').value.trim(),
                clip3: document.getElementById('input-clip3').value.trim(),
                clip4: document.getElementById('input-clip4').value.trim(),
                discord_link: document.getElementById('input-discord').value.trim()
            };

            update(ref(db, 'config'), updates).then(() => {
                alert("¡Clips y enlace de Discord guardados correctamente!");
            });
        };

        window.guardarSalonFama = function() {
            const updates = {
                salon_titulo: document.getElementById('input-salon-titulo').value.trim(),
                salon_texto: document.getElementById('input-salon-texto').value.trim()
            };

            update(ref(db, 'config'), updates).then(() => {
                alert("¡Salón de la Fama actualizado con éxito!");
            });
        };

        window.reiniciarVotos = function() {
            if(confirm("¿Estás seguro de poner todos los votos en 0? Esta acción no se puede deshacer.")) {
                set(ref(db, 'votos'), {
                    clip1: 0,
                    clip2: 0,
                    clip3: 0,
                    clip4: 0
                }).then(() => {
                    alert("¡Los contadores de votos han sido reiniciados!");
                });
            }
        };

        // Función para exportar los votos, estadísticas y comentarios en formato CSV (Compatible con Google Sheets y Excel)
        window.exportarACSV = function() {
            const votos = datosCompletosGlobales.votos || { clip1: 0, clip2: 0, clip3: 0, clip4: 0 };
            const stats = datosCompletosGlobales.estadisticas || { likes: 0, compartidos: 0 };
            const comentarios = datosCompletosGlobales.comentarios || {};

            let csvContent = "\uFEFF"; // BOM para correcta lectura de tildes y caracteres especiales en Excel/Sheets
            csvContent += "REPORTE DE RESULTADOS Y COMENTARIOS - BLOOD STRIKE LATAM\n\n";
            
            // Sección de Votos y Estadísticas
            csvContent += "CATEGORIA,VALOR\n";
            csvContent += `Votos Clip 1,${votos.clip1 || 0}\n`;
            csvContent += `Votos Clip 2,${votos.clip2 || 0}\n`;
            csvContent += `Votos Clip 3,${votos.clip3 || 0}\n`;
            csvContent += `Votos Clip 4,${votos.clip4 || 0}\n`;
            csvContent += `Total Likes,${stats.likes || 0}\n`;
            csvContent += `Total Veces Compartido,${stats.compartidos || 0}\n\n`;

            // Sección de Comentarios por Clip
            csvContent += "COMENTARIOS POR CLIP\n";
            csvContent += "CLIP,HORA,COMENTARIO\n";

            ['clip1', 'clip2', 'clip3', 'clip4'].forEach(clipKey => {
                const comsClip = comentarios[clipKey];
                if(comsClip) {
                    Object.values(comsClip).forEach(item => {
                        // Limpiamos comillas dobles y saltos de línea para que no rompan el CSV
                        const textoLimpio = (item.comentario || "").replace(/"/g, '""').replace(/\n/g, ' ');
                        const horaLimpia = item.fecha || "N/A";
                        csvContent += `"${clipKey.toUpperCase()}","${horaLimpia}","${textoLimpio}"\n`;
                    });
                }
            });

            // Crear archivo descargable
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `Reporte_BloodStrike_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            alert("¡Reporte exportado con éxito! Puedes abrir el archivo descargado directamente en Google Sheets o Excel.");
        };
    </script>
</body>
</html>
