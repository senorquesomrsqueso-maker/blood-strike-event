<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salón de la Fama - Blood Strike LATAM</title>
    <style>
        :root {
            --bg-base: #07090e;
            --bg-card: rgba(18, 22, 33, 0.95);
            --border-color: #232a40;
            --accent-cyan: #00f2ff;
            --accent-yellow: #ffcc00;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body { 
            background: radial-gradient(circle at top, #141b2d 0%, var(--bg-base) 100%); 
            color: var(--text-main); 
            min-height: 100vh; 
            padding: 40px 20px; 
        }

        .container { 
            max-width: 850px; 
            margin: 0 auto; 
            background: var(--bg-card); 
            border: 1px solid var(--border-color); 
            border-radius: 16px; 
            padding: 35px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); 
        }

        h1 { 
            color: var(--accent-cyan); 
            text-transform: uppercase; 
            margin-bottom: 25px; 
            font-size: 2rem; 
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 15px; 
            letter-spacing: 1px;
        }

        /* Contenedor dinámico del Salón de la Fama */
        .hall-content {
            background: rgba(10, 14, 23, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            min-height: 150px;
        }

        .hall-content h3 {
            color: var(--accent-yellow);
            font-size: 1.3rem;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .hall-content p {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.7;
            white-space: pre-wrap; /* Respeta saltos de línea que pongas desde el admin */
        }

        .loading-text {
            color: var(--text-muted);
            text-align: center;
            font-style: italic;
            padding: 20px;
        }

        .btn-volver { 
            display: inline-block; 
            background: linear-gradient(135deg, var(--accent-cyan), #0088ff); 
            color: #000; 
            padding: 12px 25px; 
            border-radius: 8px; 
            text-decoration: none; 
            font-weight: 900; 
            text-transform: uppercase; 
            font-size: 0.85rem; 
            box-shadow: 0 4px 15px rgba(0,242,255,0.3); 
            transition: filter 0.2s, transform 0.2s; 
        }
        .btn-volver:hover { filter: brightness(1.1); transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏆 Salón de la Fama</h1>
        
        <div class="hall-content" id="hallContainer">
            <div class="loading-text">Cargando registros históricos...</div>
        </div>

        <a href="index.html" class="btn-volver">← Volver a la Votación Principal</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

        const firebaseConfig = {
  apiKey: "AIzaSyAHPsKLBAJCu-N5SVS7mTdVHF-5AAVIGy4",
  authDomain: "blood-strike-torneo.firebaseapp.com",
  projectId: "blood-strike-torneo",
  storageBucket: "blood-strike-torneo.firebasestorage.app",
  messagingSenderId: "756331439350",
  appId: "1:756331439350:web:06fbe26b312071d94ef8d7",
  measurementId: "G-QWJBREPW9S"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Escuchar los datos del Salón de la Fama en tiempo real desde Firebase
        onValue(ref(db, 'config'), (snapshot) => {
            const config = snapshot.val() || {};
            const container = document.getElementById('hallContainer');
            
            const salonTitulo = config.salon_titulo || "Temporada Actual - Blood Strike LATAM";
            const salonTexto = config.salon_texto || "Aquí se recopilan los momentos históricos, los ganadores de torneos pasados y las leyendas de nuestra comunidad. ¡Próximamente se actualizarán los registros de los campeones!";

            container.innerHTML = `
                <h3>👑 ${escapeHtml(salonTitulo)}</h3>
                <p>${escapeHtml(salonTexto)}</p>
            `;
        });

        // Función de seguridad simple para evitar inyecciones HTML maliciosas
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
